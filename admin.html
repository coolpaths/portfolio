<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Portfolio Content</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
<style>
  *{ box-sizing:border-box; }
  body{ font-family:sans-serif; background:#0A0A0F; color:#D7E2EA; max-width:900px; margin:0 auto; padding:2rem 1.25rem 6rem; }
  h1{ font-size:1.5rem; margin-bottom:.5rem; }
  h2{ font-size:1.1rem; margin:2.5rem 0 1rem; border-bottom:1px solid #333; padding-bottom:.5rem; }
  label{ display:block; font-size:.8rem; opacity:.65; margin:1rem 0 .35rem; }
  input[type=text], input[type=email], input[type=url], textarea{
    width:100%; background:#14131c; color:#D7E2EA; border:1px solid #333;
    border-radius:8px; padding:.6rem .7rem; font-family:inherit; font-size:.9rem;
  }
  textarea{ min-height:90px; resize:vertical; }
  button{
    background:#4F46E5; color:#fff; border:none; border-radius:8px;
    padding:.6rem 1.1rem; font-size:.85rem; cursor:pointer; margin-top:.5rem;
  }
  button.secondary{ background:#262533; }
  button.danger{ background:#7f1d1d; }
  button:hover{ opacity:.85; }
  .card{ background:#121119; border:1px solid #2a2938; border-radius:10px; padding:1rem 1.1rem; margin-bottom:1rem; }
  .row{ display:flex; gap:.75rem; flex-wrap:wrap; }
  .row > *{ flex:1; min-width:140px; }
  .img-slot{ display:flex; align-items:center; gap:.6rem; margin-top:.5rem; }
  .img-slot img{ width:56px; height:56px; object-fit:cover; border-radius:6px; background:#222; flex:none; }
  .img-slot input[type=file]{ font-size:.75rem; flex:1; }
  .card-actions{ margin-top:.75rem; display:flex; gap:.5rem; }
  #status{ margin-top:1.5rem; font-size:.85rem; }
  .upload-progress{
    height:6px; background:#222; border-radius:4px; overflow:hidden;
    margin-top:.4rem; display:none;
  }
  .upload-progress-bar{ height:100%; background:#4F46E5; width:0%; transition:width .2s ease; }
  #login-box{ max-width:320px; margin:4rem auto; }
  #save-bar{
    position:sticky; bottom:0; background:#0A0A0F; border-top:1px solid #333;
    padding:1rem 0; margin-top:2rem;
  }
</style>
</head>
<body>

<div id="login-box">
  <h1>Admin Login</h1>
  <label>Email</label>
  <input id="email" type="email" />
  <label>Password</label>
  <input id="password" type="text" style="-webkit-text-security:disc;" />
  <button onclick="login()">Log in</button>
  <p id="login-status" style="margin-top:1rem; font-size:.85rem;"></p>
</div>

<div id="editor-box" style="display:none;">
  <h1>Edit Portfolio Content</h1>

  <h2>Navigation</h2>
  <div id="nav-list"></div>
  <button class="secondary" onclick="addNav()">+ Add nav link</button>

  <h2>Home / Hero</h2>
  <label>Heading</label>
  <input type="text" id="hero-heading" />
  <label>Tagline</label>
  <input type="text" id="hero-tagline" />

  <h2>Home Video (plays right after "Hi, I'm Kool")</h2>
  <div id="home-video-preview"></div>
  <input type="file" accept="video/*" onchange="handleHomeVideo(event)">
  <button class="secondary" onclick="removeHomeVideo()">Remove video</button>

  <h2>Gallery (horizontal image slider, shown right after Home)</h2>
  <div id="gallery-list"></div>
  <button class="secondary" onclick="addGalleryImage()">+ Add image</button>

  <h2>About</h2>
  <label>About text</label>
  <textarea id="about-text" style="min-height:140px;"></textarea>

  <h2>Services</h2>
  <div id="services-list"></div>
  <button class="secondary" onclick="addService()">+ Add service</button>

  <h2>Portfolio Projects</h2>
  <div id="projects-list"></div>
  <button class="secondary" onclick="addProject()">+ Add project</button>

  <h2>Contact</h2>
  <label>Email</label>
  <input type="email" id="contact-email" />
  <label>Phone numbers</label>
  <div id="phones-list"></div>
  <button class="secondary" onclick="addPhone()">+ Add phone</button>
  <label style="margin-top:1.5rem;">Social links</label>
  <div id="socials-list"></div>
  <button class="secondary" onclick="addSocial()">+ Add social link</button>

  <h2>Footer</h2>
  <label>Footer text</label>
  <input type="text" id="footer-text" />

  <div id="save-bar">
    <button onclick="save()">Save all changes</button>
    <p id="status"></p>
    <div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="upload-progress-bar"></div></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kyozprnqpzzrmyvtdxbu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_h7g2LDRQY_SeVyCF6lE6FA_F-Fws8E5';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = {
  nav: [], hero: {heading:'', tagline:''}, homeVideo: '', about: '', gallery: [],
  services: [], projects: [],
  contact: { email:'', phones:[], socials:[] },
  footer: ''
};

/* ---------- auth ---------- */
async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  const loginStatus = document.getElementById('login-status');
  if(error){ loginStatus.textContent = error.message; }
  else { showEditor(); }
}
supabaseClient.auth.getSession().then(({ data }) => { if(data.session) showEditor(); });

async function showEditor(){
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('editor-box').style.display = 'block';

  const { data } = await supabaseClient.from('content').select('*').eq('id', 1).single();
  if(data){
    if(data.nav) state.nav = data.nav;
    if(data.hero) state.hero = data.hero;
    if(data.home_video) state.homeVideo = data.home_video;
    if(data.about) state.about = data.about;
    if(data.gallery) state.gallery = data.gallery;
    if(data.services) state.services = data.services;
    if(data.projects) state.projects = data.projects;
    if(data.contact) state.contact = data.contact;
    if(data.footer) state.footer = data.footer;
  }
  document.getElementById('hero-heading').value = state.hero.heading || '';
  document.getElementById('hero-tagline').value = state.hero.tagline || '';
  document.getElementById('about-text').value = state.about || '';
  document.getElementById('contact-email').value = state.contact.email || '';
  document.getElementById('footer-text').value = state.footer || '';

  renderNav(); renderHomeVideo(); renderGallery(); renderServices(); renderProjects(); renderPhones(); renderSocials();
}

/* ---------- file upload (images, video, or audio) — resumable, with progress ---------- */
function showUploadProgress(pct){
  const bar = document.getElementById('upload-progress');
  const fill = document.getElementById('upload-progress-bar');
  bar.style.display = 'block';
  fill.style.width = pct + '%';
}
function hideUploadProgress(){
  document.getElementById('upload-progress').style.display = 'none';
  document.getElementById('upload-progress-bar').style.width = '0%';
}
async function uploadFile(file, onProgress){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  const token = sessionData.session.access_token;
  const path = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g,'')}`;
  return new Promise((resolve, reject)=>{
    const upload = new tus.Upload(file, {
      endpoint: `${SUPABASE_URL}/storage/v1/upload/resumable`,
      retryDelays: [0, 3000, 5000, 10000],
      headers: { authorization: `Bearer ${token}`, 'x-upsert': 'false' },
      uploadDataDuringCreation: true,
      removeFingerprintOnSuccess: true,
      metadata: {
        bucketName: 'portfolio-images',
        objectName: path,
        contentType: file.type || 'application/octet-stream',
        cacheControl: '3600',
      },
      chunkSize: 6 * 1024 * 1024, // required by Supabase's resumable endpoint
      onError: (error) => reject(error),
      onProgress: (sent, total) => {
        if(onProgress) onProgress(Math.round((sent / total) * 100));
      },
      onSuccess: () => {
        const { data } = supabaseClient.storage.from('portfolio-images').getPublicUrl(path);
        resolve(data.publicUrl);
      },
    });
    upload.start();
  });
}
const uploadImage = uploadFile; // kept for compatibility with existing calls below

async function runUpload(file, onDone){
  const statusEl = document.getElementById('status');
  statusEl.textContent = `Uploading ${file.name}...`;
  showUploadProgress(0);
  try{
    const url = await uploadFile(file, pct => showUploadProgress(pct));
    hideUploadProgress();
    onDone(url);
    statusEl.textContent = 'Uploaded — click "Save all changes" to publish.';
  }catch(err){
    hideUploadProgress();
    const msg = /exceed|size|too large|413/i.test(err.message || '')
      ? 'That file is too large — this plan\'s upload limit is 50MB.'
      : ('Upload failed: ' + (err.message || err));
    statusEl.textContent = msg;
  }
}

/* ---------- home video ---------- */
function renderHomeVideo(){
  document.getElementById('home-video-preview').innerHTML = state.homeVideo
    ? `<video src="${state.homeVideo}" controls style="width:100%; max-width:420px; border-radius:10px; display:block; margin-bottom:.5rem;"></video>`
    : `<p style="opacity:.5; font-size:.85rem;">No video uploaded yet.</p>`;
}
async function handleHomeVideo(e){
  const file = e.target.files[0];
  if(!file) return;
  await runUpload(file, url => { state.homeVideo = url; renderHomeVideo(); });
}
function removeHomeVideo(){ state.homeVideo = ''; renderHomeVideo(); }

/* ---------- nav ---------- */
function renderNav(){
  document.getElementById('nav-list').innerHTML = state.nav.map((n,i)=>`
    <div class="card row">
      <div><label>Label</label><input type="text" value="${escAttr(n.label)}" onchange="state.nav[${i}].label=this.value"></div>
      <div><label>Link (e.g. #about)</label><input type="text" value="${escAttr(n.href)}" onchange="state.nav[${i}].href=this.value"></div>
      <div style="flex:none; align-self:flex-end;"><button class="danger" onclick="removeNav(${i})">Delete</button></div>
    </div>
  `).join('');
}
function addNav(){ state.nav.push({label:'New Link', href:'#'}); renderNav(); }
function removeNav(i){ state.nav.splice(i,1); renderNav(); }

/* ---------- gallery ---------- */
function renderGallery(){
  document.getElementById('gallery-list').innerHTML = state.gallery.map((url,i)=>`
    <div class="img-slot">
      ${mediaPreview(url)}
      <input type="file" accept="image/*" onchange="handleGalleryImage(event, ${i})">
      <button class="danger" onclick="removeGalleryImage(${i})">Delete</button>
    </div>
  `).join('');
}
function addGalleryImage(){ state.gallery.push(''); renderGallery(); }
function removeGalleryImage(i){ state.gallery.splice(i,1); renderGallery(); }
async function handleGalleryImage(e, i){
  const file = e.target.files[0];
  if(!file) return;
  await runUpload(file, url => { state.gallery[i] = url; renderGallery(); });
}

/* ---------- services ---------- */
function renderServices(){
  document.getElementById('services-list').innerHTML = state.services.map((s,i)=>`
    <div class="card">
      <label>Name</label>
      <input type="text" value="${escAttr(s.name)}" onchange="state.services[${i}].name=this.value">
      <label>Description</label>
      <textarea onchange="state.services[${i}].desc=this.value">${escHtml(s.desc)}</textarea>
      <div class="card-actions"><button class="danger" onclick="removeService(${i})">Delete</button></div>
    </div>
  `).join('');
}
function addService(){ state.services.push({num:'', name:'New Service', desc:''}); renderServices(); }
function removeService(i){ state.services.splice(i,1); renderServices(); }

/* ---------- projects ---------- */
function renderProjects(){
  document.getElementById('projects-list').innerHTML = state.projects.map((p,i)=>`
    <div class="card">
      <div class="row">
        <div><label>Category</label><input type="text" value="${escAttr(p.category)}" onchange="state.projects[${i}].category=this.value"></div>
        <div><label>Name</label><input type="text" value="${escAttr(p.name)}" onchange="state.projects[${i}].name=this.value"></div>
      </div>
      <label>Description</label>
      <textarea onchange="state.projects[${i}].desc=this.value">${escHtml(p.desc)}</textarea>
      <label>External site link (optional — shown as "Visit Live Site" inside the media viewer)</label>
      <input type="text" value="${escAttr(p.liveUrl)}" placeholder="https://..." onchange="state.projects[${i}].liveUrl=this.value">
      <label>Images or videos (clicking the project on the live site opens all of these, playable)</label>
      ${['col1a','col1b','col2'].map(key=>`
        <div class="img-slot">
          ${mediaPreview(p[key])}
          <input type="file" accept="image/*,video/*" onchange="handleProjectImage(event, ${i}, '${key}')">
        </div>
      `).join('')}
      <label>Audio (optional)</label>
      <div class="img-slot">
        ${p.audioUrl ? `<audio src="${p.audioUrl}" controls style="height:32px;"></audio>` : `<span style="opacity:.5; font-size:.8rem;">No audio uploaded</span>`}
        <input type="file" accept="audio/*" onchange="handleProjectAudio(event, ${i})">
      </div>
      <label>Categories (e.g. "Social Media Video", "Motion Graphics", "Ads Video" — shown grouped when someone opens this project)</label>
      ${renderGroups(i)}
      <button class="secondary" onclick="addGroup(${i})">+ Add category</button>
      <div class="card-actions">
        <button class="secondary" onclick="moveProject(${i}, -1)" ${i===0 ? 'disabled style="opacity:.3;"' : ''}>↑ Move up</button>
        <button class="secondary" onclick="moveProject(${i}, 1)" ${i===state.projects.length-1 ? 'disabled style="opacity:.3;"' : ''}>↓ Move down</button>
        <button class="danger" onclick="removeProject(${i})">Delete project</button>
      </div>
    </div>
  `).join('');
}
function renderGroups(pi){
  const groups = state.projects[pi].mediaGroups || (state.projects[pi].mediaGroups = []);
  return groups.map((g,gi)=>`
    <div class="card" style="background:#0c0b12; margin-top:.5rem;">
      <div class="row">
        <input type="text" placeholder="Category name" value="${escAttr(g.name)}"
          onchange="state.projects[${pi}].mediaGroups[${gi}].name=this.value">
        <div style="flex:none;"><button class="danger" onclick="removeGroup(${pi},${gi})">Delete category</button></div>
      </div>
      ${(g.items||[]).map((url,ii)=>`
        <div class="img-slot">
          ${mediaPreview(url)}
          <span style="flex:1; font-size:.75rem; opacity:.6; word-break:break-all;">item ${ii+1}</span>
          <button class="danger" onclick="removeGroupItem(${pi},${gi},${ii})">Delete</button>
        </div>
      `).join('')}
      <label>Add image or video to this category</label>
      <input type="file" accept="image/*,video/*" onchange="handleGroupItemUpload(event, ${pi}, ${gi})">
    </div>
  `).join('');
}
function addGroup(pi){
  if(!state.projects[pi].mediaGroups) state.projects[pi].mediaGroups = [];
  state.projects[pi].mediaGroups.push({name:'New Category', items:[]});
  renderProjects();
}
function removeGroup(pi, gi){
  state.projects[pi].mediaGroups.splice(gi,1);
  renderProjects();
}
function removeGroupItem(pi, gi, ii){
  state.projects[pi].mediaGroups[gi].items.splice(ii,1);
  renderProjects();
}
async function handleGroupItemUpload(e, pi, gi){
  const file = e.target.files[0];
  if(!file) return;
  await runUpload(file, url => {
    state.projects[pi].mediaGroups[gi].items.push(url);
    renderProjects();
  });
}
function addProject(){
  state.projects.push({num:'', category:'', name:'New Project', desc:'', liveUrl:'', audioUrl:'', mediaGroups:[], col1a:'', col1b:'', col2:''});
  renderProjects();
}
async function handleProjectAudio(e, i){
  const file = e.target.files[0];
  if(!file) return;
  await runUpload(file, url => { state.projects[i].audioUrl = url; renderProjects(); });
}
function removeProject(i){ state.projects.splice(i,1); renderProjects(); }
function moveProject(i, dir){
  const j = i + dir;
  if(j < 0 || j >= state.projects.length) return;
  [state.projects[i], state.projects[j]] = [state.projects[j], state.projects[i]];
  renderProjects();
}
async function handleProjectImage(e, i, key){
  const file = e.target.files[0];
  if(!file) return;
  await runUpload(file, url => { state.projects[i][key] = url; renderProjects(); });
}

/* ---------- contact ---------- */
function renderPhones(){
  document.getElementById('phones-list').innerHTML = state.contact.phones.map((p,i)=>`
    <div class="row">
      <input type="text" value="${escAttr(p)}" onchange="state.contact.phones[${i}]=this.value">
      <div style="flex:none;"><button class="danger" onclick="removePhone(${i})">Delete</button></div>
    </div>
  `).join('');
}
function addPhone(){ state.contact.phones.push('+251'); renderPhones(); }
function removePhone(i){ state.contact.phones.splice(i,1); renderPhones(); }

function renderSocials(){
  document.getElementById('socials-list').innerHTML = state.contact.socials.map((s,i)=>`
    <div class="row">
      <input type="text" placeholder="Label" value="${escAttr(s.label)}" onchange="state.contact.socials[${i}].label=this.value">
      <input type="text" placeholder="URL" value="${escAttr(s.url)}" onchange="state.contact.socials[${i}].url=this.value">
      <div style="flex:none;"><button class="danger" onclick="removeSocial(${i})">Delete</button></div>
    </div>
  `).join('');
}
function addSocial(){ state.contact.socials.push({label:'New', url:'#'}); renderSocials(); }
function removeSocial(i){ state.contact.socials.splice(i,1); renderSocials(); }

/* ---------- save ---------- */
async function save(){
  const statusEl = document.getElementById('status');
  state.hero.heading = document.getElementById('hero-heading').value;
  state.hero.tagline = document.getElementById('hero-tagline').value;
  state.about = document.getElementById('about-text').value;
  state.contact.email = document.getElementById('contact-email').value;
  state.footer = document.getElementById('footer-text').value;

  state.services.forEach((s,i)=> s.num = String(i+1).padStart(2,'0'));
  state.projects.forEach((p,i)=> p.num = String(i+1).padStart(2,'0'));

  statusEl.textContent = 'Saving...';
  const { error } = await supabaseClient.from('content').update({
    nav: state.nav, hero: state.hero, home_video: state.homeVideo, about: state.about, gallery: state.gallery,
    services: state.services, projects: state.projects,
    contact: state.contact, footer: state.footer
  }).eq('id', 1);
  statusEl.textContent = error ? error.message : 'Saved. Refresh your site to see the changes.';
}

/* ---------- helpers ---------- */
function escAttr(str){ return (str||'').replace(/"/g,'&quot;'); }
function escHtml(str){ return (str||'').replace(/</g,'&lt;'); }
function isVideoUrl(url){ return /\.(mp4|webm|mov|ogg)(\?|$)/i.test(url || ''); }
function mediaPreview(url){
  if(!url) return `<div style="width:56px;height:56px;border-radius:6px;background:#222;flex:none;"></div>`;
  return isVideoUrl(url)
    ? `<video src="${url}" muted style="width:56px;height:56px;object-fit:cover;border-radius:6px;background:#222;flex:none;"></video>`
    : `<img src="${url}" onerror="this.style.visibility='hidden'">`;
}
</script>
</body>
</html>
